
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonlitFlight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-wrapper">
        <header class="game-header">
            <p class="eyebrow">A little flight through winter</p>
            <h1>MOONLIT FLIGHT</h1>
            <p class="subtitle">Somewhere between the stars and the snow.</p>
        </header>

        <section class="game-container">
            <canvas
                id="gameCanvas"
                width="240"
                height="320"
                aria-label="MoonlitFlight pixel-art game"
            ></canvas>

            <div class="game-controls">
                <span>SPACE / CLICK — FLY</span>
                <span>M — MUSIC</span>
            </div>
        </section>

        <footer>
            <p>For the ones still finding their way home.</p>
        </footer>
    </main>

    <script src="game.js"></script>
</body>
</html>
